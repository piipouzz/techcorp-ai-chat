<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechCorp AI Chat</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Conversations">
        <div class="product-header">
          <div>
            <h1>TechCorp</h1>
            <p>Analyse financiere</p>
          </div>
          <div class="status-dot" id="statusPill" data-state="checking">Verification</div>
        </div>

        <button class="new-chat" id="newChatButton" type="button">Nouvelle conversation</button>
        <nav class="conversation-list" id="conversationList"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="section-label">Assistant financier</p>
            <h2 id="conversationTitle">Nouvelle conversation</h2>
          </div>
          <div class="generation-indicator" id="generationIndicator" hidden>Generation en cours</div>
        </header>

        <div class="error-bar" id="errorBar" hidden></div>
        <section class="messages" id="messages" aria-live="polite"></section>

        <form class="composer" id="composer">
          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="6000"
            placeholder="Ecrire un message..."
            autocomplete="off"
          ></textarea>
          <button id="sendButton" type="submit">Envoyer</button>
        </form>
      </main>
    </div>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
